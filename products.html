<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Phoria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">PHORIA</a>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="products.html">SHOP THE COLLECTION</a>
                <a href="feeling.html">THE FEELING</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>
            <a href="cart.html" class="cart-icon">
                🛒 <span class="cart-count" id="cart-count">0</span>
            </a>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- PAGE HERO -->
    <section class="page-hero">
        <h1>Shop The Collection</h1>
        <p>Choose your vibe</p>
    </section>

    <!-- COLLECTION SELECTOR -->
    <section class="collection-selector" id="collectionSelector">
        <div class="collection-grid">
            <!-- Black and White Collection -->
            <div class="collection-card" onclick="filterCollection('blackandwhite')">
                <img src="images/PHORIA Aromatic Smoke Still Life.png" alt="Black & White Collection">
                <div class="collection-overlay">
                    <h2>Black & White</h2>
                    <p>Best of Both Worlds</p>
                </div>
            </div>

            <!-- Black Collection -->
            <div class="collection-card" onclick="filterCollection('black')">
                <img src="images/Vibrant Phoria Flavor Showcase black.png" alt="Black Collection">
                <div class="collection-overlay">
                    <h2>Black Collection</h2>
                    <p>Dark and Mysterious</p>
                </div>
            </div>

            <!-- White Collection -->
            <div class="collection-card" onclick="filterCollection('white')">
                <img src="images/PHORIA Flavours in Vibrant Smoke white.png" alt="White Collection">
                <div class="collection-overlay">
                    <h2>White Collection</h2>
                    <p>Clean and Whimsical</p>
                </div>
            </div>
        </div>
    </section>

    <!-- PRODUCTS GRID (Hidden by default) -->
    <section class="products-grid-section" id="productsSection" style="display: none;">
        <div class="collection-header">
            <h2 id="collectionTitle"></h2>
            <button class="btn btn-outline" onclick="backToCollections()">← Back to Collections</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be populated by JavaScript -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://instagram.com" target="_blank">Instagram</a>
                <a href="https://wa.me/254" target="_blank">WhatsApp</a>
                <a href="https://tiktok.com" target="_blank">TikTok</a>
                <a href="contact.html">Contact</a>
            </div>
            <p>&copy; 2026 Phoria. Breathe in the Moment.</p>
        </div>
    </footer>

    <!-- LOAD EMAILJS FIRST -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>
    
    <!-- THEN LOAD SCRIPT.JS -->
    <script src="script.js"></script>

    <!-- THEN INLINE SCRIPT -->
    <script>
        function filterCollection(collection) {
            const selector = document.getElementById('collectionSelector');
            const productsSection = document.getElementById('productsSection');
            const collectionTitle = document.getElementById('collectionTitle');
            const productsGrid = document.getElementById('productsGrid');
            
            // Hide selector, show products
            selector.style.display = 'none';
            productsSection.style.display = 'block';
            
            // Set title
            if (collection === 'black') {
                collectionTitle.textContent = 'Black Collection';
            } else if (collection === 'white') {
                collectionTitle.textContent = 'White Collection';
            } else if (collection === 'blackandwhite') {
                collectionTitle.textContent = 'Black & White Collection';
            }
            
            // Filter and display products WITH STOCK CHECK
            const filteredProducts = products.filter(p => p.collection === collection);
            productsGrid.innerHTML = filteredProducts.map(product => {
                const stock = inventory[product.id] || 0;
                const outOfStock = stock <= 0;
                
                return `
                    <div class="product-card ${outOfStock ? 'out-of-stock' : ''}">
                        ${outOfStock ? '<div class="sold-out-badge">SOLD OUT</div>' : ''}
                        <div class="product-card-image">
                            <img src="${product.image}" alt="${product.name}" ${outOfStock ? 'style="opacity: 0.5;"' : ''}>
                        </div>
                        <div class="product-card-content">
                            <h3>${product.name}</h3>
                            <p class="scent">${product.scent}</p>
                            <p class="benefit">${product.benefit}</p>
                            <p class="price">KSh ${product.price}</p>
                            ${outOfStock ? 
                                '<button class="btn btn-outline" style="background: #ccc; color: #666; cursor: not-allowed;" disabled>Out of Stock</button>' :
                                `<button class="btn btn-outline" onclick="addToCart(${product.id})">Add to Cart</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
            
            // Scroll to top
            window.scrollTo(0, 0);
        }

        function backToCollections() {
            document.getElementById('collectionSelector').style.display = 'block';
            document.getElementById('productsSection').style.display = 'none';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
