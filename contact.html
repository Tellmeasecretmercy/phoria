<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Phoria</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">PHORIA</a>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="products.html">SHOP THE COLLECTION</a>
                <a href="feeling.html">THE FEELING</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>
            <a href="cart.html" class="cart-icon">
                🛒 <span class="cart-count" id="cart-count">0</span>
            </a>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- PAGE HERO -->
    <section class="page-hero">
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you</p>
    </section>

    <!-- CONTACT CONTENT -->
    <section class="contact-section">
        <div class="contact-container">
            <form class="contact-form" onsubmit="handleContact(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="6" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>

            <div class="contact-info">
                <h3>Other Ways to Reach Us</h3>
                <div class="contact-methods">
                    <div class="contact-method">
                        <h4>WhatsApp</h4>
                        <a href="https://wa.me/254" target="_blank">Message us</a>
                    </div>
                    <div class="contact-method">
                        <h4>Instagram</h4>
                        <a href="https://instagram.com/@phoria_breathe" target="_blank">@phoria_breathe</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://instagram.com" target="_blank">Instagram</a>
                <a href="https://wa.me/254" target="_blank">WhatsApp</a>
                <a href="https://tiktok.com" target="_blank">TikTok</a>
            </div>
            <p>&copy; 2026 Phoria. Breathe in the Moment.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
