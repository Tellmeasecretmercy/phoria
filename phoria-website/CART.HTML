<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Phoria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">PHORIA</a>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="products.html">SHOP THE COLLECTION</a>
                <a href="feeling.html">THE FEELING</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>
            <a href="cart.html" class="cart-icon">
                🛒 <span class="cart-count" id="cart-count">0</span>
            </a>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- PAGE HERO -->
    <section class="page-hero">
        <h1>Your Cart</h1>
    </section>

    <!-- CART CONTENT -->
    <section class="cart-section">
        <div class="cart-container">
            <div class="cart-items" id="cart-items">
                <!-- Items will be populated by JavaScript -->
            </div>
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">KSh 0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span>KSh 0</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">KSh 0</span>
                </div>
                <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
                <a href="products.html" class="btn btn-outline btn-full">Continue Shopping</a>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://instagram.com" target="_blank">Instagram</a>
                <a href="https://wa.me/254" target="_blank">WhatsApp</a>
                <a href="https://tiktok.com" target="_blank">TikTok</a>
                <a href="contact.html">Contact</a>
            </div>
            <p>&copy; 2026 Phoria. Breathe in the Moment.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
