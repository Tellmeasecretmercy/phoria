<!-- CHECKOUT FORM -->
<section class="checkout-section">
    <div class="checkout-container">

        <form class="checkout-form" id="checkoutForm" onsubmit="handleCheckout(event)">

            <div class="form-section">
                <h3>Shipping Information</h3>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-group">
                    <label>City/Region</label>
                    <input type="text" id="city" name="city" required>
                </div>
            </div>

            <div class="form-section">
                <h3>Payment Method</h3>

                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="mpesa" checked>
                        <span>M-Pesa</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="cod">
                        <span>Cash on Delivery</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Complete Order</button>

        </form>

        <div class="checkout-summary">
            <h3>Order Summary</h3>
            <div id="checkout-items"></div>
            <div class="summary-row summary-total">
                <span>Total</span>
                <span id="checkout-total">KSh 0</span>
            </div>
        </div>

    </div>
</section>
